<div class="login-wrapper">
  <div class="login-container">
    <!-- Logo Section -->
    <div class="logo-section">
      <div class="logo-icon">💬</div>
      <h1>CyberChat</h1>
      <p>Intelligence at your fingertips</p>
    </div>

    <!-- Login Form -->
    <div class="form-section">
      <div class="form-header">
        <button 
          class="form-tab" 
          [class.active]="!isSignUp"
          (click)="isSignUp = false">
          Sign In
        </button>
        <button 
          class="form-tab" 
          [class.active]="isSignUp"
          (click)="isSignUp = true">
          Sign Up
        </button>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <!-- Sign In Form -->
      <div *ngIf="!isSignUp" class="form-content">
        <div class="form-group">
          <input 
            type="text"
            placeholder="Username"
            class="input-field"
            [(ngModel)]="username"
            (keyup.enter)="login()"
            [disabled]="isLoading">
        </div>
        <div class="form-group">
          <input 
            type="password"
            placeholder="Password"
            class="input-field"
            [(ngModel)]="password"
            (keyup.enter)="login()"
            [disabled]="isLoading">
        </div>
        <button 
          class="submit-btn"
          (click)="login()"
          [disabled]="isLoading">
          {{ isLoading ? 'Signing In...' : 'Sign In' }}
        </button>
      </div>

      <!-- Sign Up Form -->
      <div *ngIf="isSignUp" class="form-content">
        <div class="form-group">
          <input 
            type="text"
            placeholder="Choose a username"
            class="input-field"
            [(ngModel)]="username"
            [disabled]="isLoading">
        </div>
        <div class="form-group">
          <input 
            type="password"
            placeholder="Create a password"
            class="input-field"
            [(ngModel)]="password"
            [disabled]="isLoading">
        </div>
        <button 
          class="submit-btn"
          (click)="signUp()"
          [disabled]="isLoading">
          {{ isLoading ? 'Creating Account...' : 'Create Account' }}
        </button>
      </div>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      <p>Secure cybersecurity intelligence powered by AI</p>
    </div>
  </div>
</div>
