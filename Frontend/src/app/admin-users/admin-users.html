<div class="users-dashboard">
  <div class="dashboard-header">
    <div>
      <h2>User Management</h2>
      <p class="subtitle">Manage enterprise access and security clearances.</p>
    </div>
    <button class="refresh-btn" (click)="loadUsers()" [disabled]="loading">
      <span *ngIf="loading">⏳ Loading...</span>
      <span *ngIf="!loading">🔄 Refresh Data</span>
    </button>
  </div>

  <div *ngIf="error" class="error-banner">
    ⚠️ {{ error }}
  </div>

  <!-- Advanced Filtering Bar -->
  <div class="filters-bar">
    <div class="search-box">
      <input 
        type="text" 
        placeholder="🔍 Search usernames..." 
        [(ngModel)]="searchQuery" 
        (ngModelChange)="applyFilters()">
    </div>
    
    <div class="filter-group">
      <select [(ngModel)]="roleFilter" (ngModelChange)="updateRoleFilter($event)">
        <option value="all">All Roles</option>
        <option value="admin">Administrators</option>
        <option value="user">Standard Users</option>
        <option value="analyst">Analysts</option>
      </select>
      
      <select [(ngModel)]="statusFilter" (ngModelChange)="updateStatusFilter($event)">
        <option value="all">All Statuses</option>
        <option value="active">🟢 Active</option>
        <option value="suspended">🔴 Suspended</option>
        <option value="pending">🟡 Pending</option>
      </select>
    </div>
  </div>

  <!-- Enterprise Data Table -->
  <div class="table-wrapper">
    <table class="enterprise-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Role</th>
          <th>Status</th>
          <th>Security Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of filteredUsers">
          <td class="id-cell">#{{ user.id }}</td>
          <td class="username-cell">{{ user.username }}</td>
          <td>
            <span class="role-badge" [ngClass]="'role-' + user.role">
              {{ user.role | uppercase }}
            </span>
          </td>
          <td>
            <span class="status-badge" [ngClass]="'status-' + user.status">
              {{ user.status }}
            </span>
          </td>
          <td class="actions-cell">
            <button class="action-btn warn-btn" 
                    [disabled]="user.role === 'admin'" 
                    (click)="toggleUserStatus(user)" 
                    title="Suspend or Activate User">
              {{ user.status === 'active' ? 'Suspend' : 'Activate' }}
            </button>
            <button class="action-btn sec-btn" (click)="forceMfa(user)">Force MFA</button>
            <button class="action-btn sec-btn" (click)="rotateCredentials(user)">Rotate Creds</button>
            <button class="action-btn danger-btn" 
                    [disabled]="user.role === 'admin'" 
                    (click)="deleteUser(user.id)">
              Delete
            </button>
          </td>
        </tr>
        
        <!-- Empty States -->
        <tr *ngIf="!loading && filteredUsers.length === 0">
          <td colspan="5" class="empty-state">
            No users match your current filters.
          </td>
        </tr>
        <tr *ngIf="loading">
          <td colspan="5" class="empty-state loading-state">
            Decrypting user database...
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
